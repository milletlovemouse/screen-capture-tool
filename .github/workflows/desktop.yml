name: Desktop checks
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: macos
            arch: x64
            target: x86_64-apple-darwin
          - os: windows-latest
            platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            platform: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@10
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile --registry https://registry.npmjs.org
      - run: pnpm test
      - run: pnpm build
      - name: Install Windows resource compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command llvm-rc -ErrorAction SilentlyContinue)) {
            choco install llvm --yes --no-progress
          }
          $llvmBin = Join-Path $env:ProgramFiles "LLVM\bin"
          if (-not (Test-Path (Join-Path $llvmBin "llvm-rc.exe"))) {
            throw "llvm-rc.exe was not found in $llvmBin"
          }
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - if: matrix.platform == 'windows'
        shell: bash
        run: |
          args=(--target "${{ matrix.target }}")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=(--config src-tauri/tauri.release.conf.json)
            args+=(--config "{\"version\":\"${GITHUB_REF_NAME#v}\"}")
          fi
          pnpm tauri build "${args[@]}"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Normalize Windows artifact names
        if: matrix.platform == 'windows'
        shell: python
        run: |
          from pathlib import Path

          bundle = Path("src-tauri/target/${{ matrix.target }}/release/bundle")
          signatures = sorted(bundle.rglob("*截图工具*.sig"))
          artifacts = sorted(
              (path for path in bundle.rglob("*截图工具*") if path.suffix != ".sig"),
              key=lambda path: len(path.parts),
              reverse=True,
          )

          for artifact in artifacts:
              target = artifact.with_name(artifact.name.replace("截图工具", "ScreenCaptureTool", 1))
              artifact.rename(target)

          for signature in signatures:
              target = signature.with_name(signature.name.replace("截图工具", "ScreenCaptureTool", 1))
              signature.rename(target)
      - if: matrix.platform == 'macos'
        shell: bash
        run: |
          args=(--target "${{ matrix.target }}")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=(--config src-tauri/tauri.release.conf.json)
            args+=(--config "{\"version\":\"${GITHUB_REF_NAME#v}\"}")
          fi
          pnpm tauri build "${args[@]}"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify macOS app signature
        if: matrix.platform == 'macos'
        run: |
          codesign --verify --deep --strict --verbose=2 \
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/ScreenCaptureTool.app
      - name: Package macOS app
        if: matrix.platform == 'macos'
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/ScreenCaptureTool.app \
            src-tauri/target/${{ matrix.target }}/release/bundle/ScreenCaptureTool-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: false
      - name: Generate updater manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          root = Path("release-assets")
          publish = root / "publish"
          publish.mkdir(parents=True, exist_ok=True)
          mapping = {
              "desktop-macos-arm64": "darwin-aarch64",
              "desktop-macos-x64": "darwin-x86_64",
              "desktop-windows-arm64": "windows-aarch64",
              "desktop-windows-x64": "windows-x86_64",
          }
          platforms = {}
          tag = os.environ["RELEASE_TAG"]
          repository = os.environ["REPOSITORY"]
          previous_tag = subprocess.run(
              ["git", "describe", "--tags", "--abbrev=0", f"{tag}^"],
              capture_output=True,
              check=False,
              text=True,
          ).stdout.strip()
          revision = f"{previous_tag}..{tag}" if previous_tag else tag
          subjects = subprocess.run(
              ["git", "log", "--format=%s", revision],
              capture_output=True,
              check=True,
              text=True,
          ).stdout.splitlines()
          changes = [
              subject for subject in subjects
              if not subject.startswith("chore: release ")
          ]
          notes = "\n".join(f"• {subject}" for subject in changes)
          if not notes:
              notes = f"截图工具 {tag}"

          for signature in root.glob("desktop-*/**/*.sig"):
              artifact = Path(str(signature)[:-4])
              group = next((part for part in signature.parts if part in mapping), None)
              if not group or not artifact.exists():
                  continue
              target = mapping[group]
              name = artifact.name
              if target in platforms and ".nsis.zip" not in name:
                  continue
              for extension in (".app.tar.gz", ".nsis.zip", ".msi.zip", ".exe", ".msi"):
                  if name.endswith(extension):
                      name = f"{name[:-len(extension)]}-{target}{extension}"
                      break
              else:
                  raise SystemExit(f"Unsupported signed updater artifact: {name}")
              published_artifact = publish / name
              published_signature = publish / f"{name}.sig"
              shutil.copy2(artifact, published_artifact)
              shutil.copy2(signature, published_signature)
              platforms[target] = {
                  "signature": signature.read_text().strip(),
                  "url": (
                      f"https://github.com/{repository}/releases/download/"
                      f"{tag}/{name}"
                  ),
              }

          if not platforms:
              raise SystemExit("No signed updater artifacts were found")
          (root / "latest.json").write_text(
              json.dumps(
                  {
                      "version": tag.removeprefix("v"),
                      "notes": notes,
                      "platforms": platforms,
                  },
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n"
          )
          PY
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.zip
            release-assets/**/*.exe
            release-assets/**/*.dmg
            release-assets/**/*.msi
            release-assets/**/latest.json
            release-assets/**/*.sig
            release-assets/**/*.tar.gz
