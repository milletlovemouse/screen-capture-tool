name: Desktop checks
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: macos
            arch: x64
            target: x86_64-apple-darwin
          - os: windows-latest
            platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            platform: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@10
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile --registry https://registry.npmjs.org
      - run: pnpm test
      - run: pnpm build
      - name: Install Windows resource compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command llvm-rc -ErrorAction SilentlyContinue)) {
            choco install llvm --yes --no-progress
          }
          $llvmBin = Join-Path $env:ProgramFiles "LLVM\bin"
          if (-not (Test-Path (Join-Path $llvmBin "llvm-rc.exe"))) {
            throw "llvm-rc.exe was not found in $llvmBin"
          }
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - if: matrix.platform == 'windows'
        run: pnpm tauri build --target ${{ matrix.target }}
      - if: matrix.platform == 'macos'
        run: pnpm tauri build --target ${{ matrix.target }}
      - name: Package macOS app
        if: matrix.platform == 'macos'
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/ScreenCaptureTool.app \
            src-tauri/target/${{ matrix.target }}/release/bundle/ScreenCaptureTool-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: false
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.zip
            release-assets/**/*.exe
            release-assets/**/*.dmg
            release-assets/**/*.msi
