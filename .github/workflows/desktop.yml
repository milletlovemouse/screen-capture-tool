name: Desktop checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@10
        env:
          HOME: ${{ runner.temp }}/home
          npm_config_cache: ${{ runner.temp }}/npm-cache
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile --registry https://registry.npmjs.org
        env:
          HOME: ${{ runner.temp }}/home
      - run: pnpm test
        env:
          HOME: ${{ runner.temp }}/home
      - run: pnpm build
        env:
          HOME: ${{ runner.temp }}/home
      - name: Install Windows resource compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command llvm-rc -ErrorAction SilentlyContinue)) {
            choco install llvm --yes --no-progress
          }
          $llvmBin = Join-Path $env:ProgramFiles "LLVM\bin"
          if (-not (Test-Path (Join-Path $llvmBin "llvm-rc.exe"))) {
            throw "llvm-rc.exe was not found in $llvmBin"
          }
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - if: runner.os == 'Windows'
        run: pnpm tauri build --bundles nsis
        env:
          HOME: ${{ runner.temp }}/home
      - if: runner.os == 'macOS'
        run: pnpm tauri build --bundles app
        env:
          HOME: ${{ runner.temp }}/home
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: src-tauri/target/release/bundle/
