[package]
name = "screen-capture-tool"
version = "0.4.5"
description = "A lightweight desktop screenshot tool"
edition = "2021"

[lib]
name = "screen_capture_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
xcap = "0.9.8"
image = { version = "0.25.10", default-features = false, features = ["png"] }
png = "0.17.16"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2.13.3"
tauri-plugin-process = "2.4.0"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "=0.20.0", default-features = false }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std", "NSApplication", "NSImage", "NSMenu", "NSMenuItem", "NSStatusItem",
] }
objc2-foundation = { version = "0.3.2", features = ["NSGeometry", "NSProcessInfo", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "2.0.1"
windows = { version = "0.62.2", features = [
    "Win32_System_WinRT",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Performance",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
