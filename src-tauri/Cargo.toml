[package]
name = "screen-capture-tool"
version = "0.1.0"
description = "A lightweight desktop screenshot tool"
edition = "2021"

[lib]
name = "screen_capture_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
xcap = "0.9.8"
image = "0.25.10"
tauri-plugin-notification = "2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
muda = { version = "=0.20.0", default-features = false }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std", "NSApplication", "NSMenu", "NSResponder",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "2.0.1"
windows = { version = "0.62.2", features = ["Win32_System_WinRT"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
